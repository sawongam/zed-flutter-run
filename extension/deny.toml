# cargo-deny configuration. Run: cd extension && cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "wasm32-wasip2",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# The project itself is BSD-3-Clause; only permissive licenses are allowed.
allow = [
  "BSD-3-Clause",
  "BSD-2-Clause",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
