[package]
name = "flutter_run_debugger"
version = "0.1.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
description = "Zed extension: Flutter Run & Debug (debug adapter FlutterRun)"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde_json = "1"
# 0.11: `format!("{:x}", digest)` does not compile, so hex is encoded by hand.
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that only add noise for this small crate.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
# Extensions are compared after lower-casing by hand.
case_sensitive_file_extension_comparisons = "allow"
