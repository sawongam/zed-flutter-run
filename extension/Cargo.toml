[package]
name = "flutter_run_debugger"
version = "0.1.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
description = "Zed extension: Flutter Run & Debug (debug adapter FlutterRun)"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde_json = "1"
# 0.11: `format!("{:x}", digest)` does not compile, so hex is encoded by hand.
sha2 = "0.11"
