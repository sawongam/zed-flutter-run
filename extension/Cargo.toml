[package]
name = "flutter_run_debugger"
version = "0.1.4"
edition = "2024"
publish = false
license = "BSD-3-Clause"
repository = "https://github.com/sawongam/zed-flutter-run"
description = "Zed extension: Flutter Run & Debug (debug adapter FlutterRun)"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde_json = "1"
# 0.11: `format!("{:x}", digest)` does not compile, so hex is encoded by hand.
sha2 = "0.11"

[profile.release]
# Small wasm: the extension is downloaded by every user.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
# File extensions are compared after lower-casing by hand.
case_sensitive_file_extension_comparisons = "allow"
