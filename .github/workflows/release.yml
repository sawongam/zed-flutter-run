# Release workflow. Runs when a push to prod changes cli/pubspec.yaml to a
# version that has no release yet, or by hand (workflow_dispatch). It builds the
# binaries, writes SHA256SUMS, attests them, then creates the git tag vX.Y.Z and
# the GitHub release. If the release already exists, every job after `version` is
# skipped, so ordinary pushes do nothing.
#
# No pub.dev (see publish-pub.yml), crates.io, Homebrew, Scoop or Zed registry
# publishing happens here. The last job pins the new checksums into the
# extension and pushes that commit to prod: see docs/RELEASE.md.
name: Release build

on:
  push:
    branches: [prod]
    paths: ["cli/pubspec.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree and the release does not exist yet
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh .github/scripts/check-versions.sh
          ver=$(sed -n 's/^version:[[:space:]]*\([0-9][^[:space:]#]*\).*/\1/p' cli/pubspec.yaml | head -n 1)
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Release v$ver already exists, nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [version]
    if: needs.version.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, ext: "" }
          - { os: macos-latest, target: macos-arm64, ext: "" }
          - { os: macos-15-intel, target: macos-x64, ext: "" }
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # After checkout: the default working directory (cli) does not exist before it.
      - name: Compute asset name
        run: echo "ASSET=flutter_run-${{ needs.version.outputs.tag }}-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: mkdir -p build && dart compile exe bin/flutter_run.dart -o "build/$ASSET"
      - name: Smoke test
        run: |
          chmod +x "build/$ASSET"
          "./build/$ASSET" version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: cli/build/${{ env.ASSET }}
          retention-days: 30
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: flutter_run-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum flutter_run-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

  attest:
    name: Build provenance
    needs: [checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write       # sign the attestation with the workflow's OIDC identity
      attestations: write   # store it in the repository's attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Attest build provenance (flutter_run-* binaries and SHA256SUMS)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/flutter_run-*
            dist/SHA256SUMS

  publish-github-release:
    name: GitHub release
    needs: [version, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ver="${TAG#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (on) exit; if (index($0, "## [" ver "]") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No section '## [$ver]' with content in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md
      - name: Create release (and the tag, on this commit)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md

  pin-checksums:
    name: Pin checksums into the extension
    needs: [version, publish-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push the pin commit to prod
    steps:
      # Latest prod, not the released commit: the pin commit goes on top of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
      - name: Write checksums.rs from the release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
          sh .github/scripts/pin-checksums.sh "$RUNNER_TEMP/release/SHA256SUMS" > extension/src/checksums.rs
          [ "$(grep -c "\"flutter_run-$TAG-" extension/src/checksums.rs)" -eq 5 ] || {
            echo "::error::Expected five $TAG entries in checksums.rs"
            exit 1
          }
      - name: Extension still builds and passes
        working-directory: extension
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Commit and push to prod
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/checksums.rs
          git commit -m "chore(release): pin $TAG checksums"
          git push origin HEAD:prod
