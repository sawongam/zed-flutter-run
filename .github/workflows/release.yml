# Release workflow. Nothing here publishes anywhere public on its own:
#   build / checksums / attest  -> artifacts + signed build provenance only.
#   publish-github-release      -> creates a DRAFT GitHub release, and only after a
#                                  human approves the protected `release` environment
#                                  (Settings > Environments > release > Required reviewers).
# No pub.dev (see publish-pub.yml, also environment-gated), crates.io, Homebrew,
# Scoop or Zed registry publishing happens here.
#
# Triggered by pushing a tag `v*` or manually (workflow_dispatch). The attest and
# publish jobs run for tag pushes only.
#
# Human release steps (see docs/RELEASE.md for the full, authoritative list):
#   1. Bump versions (.github/scripts/check-versions.sh must pass), tag vX.Y.Z.
#   2. The workflow builds, attests, then waits for approval of the `release` environment.
#   3. Approve; review the DRAFT release and publish it yourself.
#   4. Run .github/scripts/pin-checksums.sh SHA256SUMS > extension/src/checksums.rs
#      and commit it (flip PUBLISHED_ON_PUB only after pub.dev publication).
#   5. Submit the extension / publish packages by hand (next commit, not the tag commit).
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, ext: "" }
          - { os: macos-latest, target: macos-arm64, ext: "" }
          - { os: macos-15-intel, target: macos-x64, ext: "" }
          - { os: windows-latest, target: windows-x64, ext: ".exe" }
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      # workflow_dispatch runs on a branch: slashes in the ref name are replaced.
      - name: Compute asset name
        run: echo "ASSET=flutter_run-$(echo "$GITHUB_REF_NAME" | tr '/' '-')-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: mkdir -p build && dart compile exe bin/flutter_run.dart -o "build/$ASSET"
      - name: Smoke test
        run: |
          chmod +x "build/$ASSET"
          "./build/$ASSET" version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: cli/build/${{ env.ASSET }}
          retention-days: 30
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: flutter_run-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum flutter_run-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

  attest:
    name: Build provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write       # sign the attestation with the workflow's OIDC identity
      attestations: write   # store it in the repository's attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Attest build provenance (flutter_run-* binaries and SHA256SUMS)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/flutter_run-*
            dist/SHA256SUMS

  publish-github-release:
    name: Draft GitHub release (needs approval)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The maintainer must create the `release` environment with required
    # reviewers; without it this job would run unattended. See docs/RELEASE.md.
    environment: release
    permissions:
      contents: write   # create the (draft) release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (on) exit; if (index($0, "## [" ver "]") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No section '## [$ver]' with content in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file release-notes.md
