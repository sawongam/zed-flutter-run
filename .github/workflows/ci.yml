name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter version the integration suite is tested with.
  FLUTTER_VERSION: "3.47.9"

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh .github/scripts/check-versions.sh

  dart:
    name: Dart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: cli
    env:
      EXE: build/flutter_run${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Cache pub packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('cli/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Unit tests
        run: dart test --exclude-tags integration --exclude-tags integration-dart
      - name: Integration tests (dart debug_adapter, no Flutter needed)
        run: dart test -t integration-dart -j 1
      - name: Compile native executable
        run: mkdir -p build && dart compile exe bin/flutter_run.dart -o "$EXE"
      - name: Smoke test executable
        run: |
          "./$EXE" version
          "./$EXE" --help
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cp "$EXE" "$RUNNER_TEMP/elsewhere/"
          "$RUNNER_TEMP/elsewhere/$(basename "$EXE")" version
      - name: Show code signature (macOS)
        if: runner.os == 'macOS'
        run: codesign -dv "$EXE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter_run-${{ matrix.os }}
          path: cli/${{ env.EXE }}
          retention-days: 7
          if-no-files-found: error

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (moving tag)
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'ubuntu-latest' && 'wasm32-wasip2' || '' }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: extension
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Clippy (wasm32-wasip2)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - name: Build extension (wasm32-wasip2)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked --release --target wasm32-wasip2
      - name: Upload wasm
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-wasm
          path: extension/target/wasm32-wasip2/release/*.wasm
          retention-days: 7
          if-no-files-found: error

  integration:
    # Linux only for now (flutter-tester). Add macOS/Windows jobs for this
    # suite if it proves stable there.
    name: Integration (flutter-tester, Linux)
    needs: [versions]  # independent of the per-OS Dart matrix, so one OS (or a queued macOS runner) does not block it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter precache --linux
      - run: flutter doctor -v
      - name: Check flutter-tester is available
        run: flutter devices --show-test-device
      - run: dart pub get --enforce-lockfile
      - run: dart test -t integration -j 1 --reporter expanded
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: cli/.dart_tool/flutter_run_test/**
          retention-days: 7
          if-no-files-found: ignore
