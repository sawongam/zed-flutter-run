# Opens/updates a "release PR" that bumps every version location (see
# release-please-config.json). It only opens PRs: releases and tags are skipped
# (skip-github-release) and CHANGELOG.md stays hand-written. A human merges the PR
# and tags. Needs Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests". PRs opened with GITHUB_TOKEN do not trigger CI;
# close/reopen the PR (or use a PAT/GitHub App token) to run checks.
name: Release PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
